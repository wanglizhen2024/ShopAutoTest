name: ERP Automated Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4

      - name: 2. 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 3. 执行 Maven 测试
        run: mvn clean test

      - name: 4. 上传 Allure 测试报告结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-resultset/allure-results